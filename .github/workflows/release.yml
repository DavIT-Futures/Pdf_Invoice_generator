name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: windows-x64
          - rid: win-x86
            platform: windows-x86
          - rid: win-arm64
            platform: windows-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish application
        run: dotnet publish PdfDavITFutures/PdfDavITFutures.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Clean up PDBs
        shell: pwsh
        run: Remove-Item -Force ./publish/*.pdb -ErrorAction SilentlyContinue

      - name: Archive
        shell: pwsh
        run: |
          $ver = if ("${{ github.ref_name }}") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $filename = "Pdf_Invoice_generator-$ver-${{ matrix.platform }}.zip"
          Compress-Archive -Path ./publish/* -DestinationPath ./$filename -Force

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./Pdf_Invoice_generator-${{ github.ref_name }}-${{ matrix.platform }}.zip
